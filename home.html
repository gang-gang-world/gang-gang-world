<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">
<title>ギャンギャンワールド 総合ホーム</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:auto;
  max-width:650px;
  padding:15px 12px 50px;
  min-height:100vh;
  background:linear-gradient(
    160deg,#090c12,#111827,#090c12
  );
  color:#f5f7fa;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

header{
  text-align:center;
  padding:25px 0;
}

.logo{
  color:#f5cf65;
  letter-spacing:4px;
  font-size:11px;
  font-weight:bold;
}

h1{
  color:#f5cf65;
  font-size:26px;
  margin:12px 0;
  text-shadow:0 0 18px #a77b35;
}

h2{
  color:#f5cf65;
  font-size:17px;
  margin:0 0 15px;
}

small{
  color:#9ca9bc;
}

section{
  background:#171e2c;
  border:1px solid #354052;
  border-radius:16px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 8px 25px #0006;
}

.wallet{
  border-color:#9b803e;
  text-align:center;
  background:linear-gradient(
    135deg,#202b3c,#121925
  );
}

#balance{
  font-size:32px;
  color:#f5cf65;
  font-weight:900;
  margin:12px 0;
}

.categories{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.race{
  display:block;
  padding:22px 8px;
  border:1px solid #c9a34e;
  border-radius:16px;
  text-align:center;
  color:white;
  text-decoration:none;
}

.boat{
  background:linear-gradient(
    135deg,#204b70,#102033
  );
}

.horse{
  background:linear-gradient(
    135deg,#236746,#102d20
  );
}

.emoji{
  font-size:40px;
}

.name{
  font-size:22px;
  font-weight:900;
  margin:10px 0;
}

.english{
  color:#f5cf65;
  font-size:10px;
  letter-spacing:2px;
}

.enter{
  margin-top:18px;
  padding:10px;
  border-radius:8px;
  background:#ffffff15;
  font-size:14px;
  font-weight:bold;
}

.raceInfo{
  background:#101722;
  border:1px solid #354052;
  border-radius:10px;
  padding:14px;
  margin:8px 0;
  line-height:1.8;
}

.login{
  display:inline-block;
  color:#f5cf65;
  background:#293447;
  text-decoration:none;
  padding:10px 20px;
  border-radius:10px;
  margin:10px 0;
}

.notice{
  color:#bac5d5;
  font-size:13px;
  line-height:1.8;
}

footer{
  text-align:center;
  padding:20px;
  font-size:11px;
  color:#7c899d;
  letter-spacing:2px;
}

[hidden]{
  display:none!important;
}
</style>
</head>

<body>

<header>
  <div class="logo">GANG GANG WORLD</div>
  <h1>ギャンギャンワールド</h1>
  <small>総合レースゲーム</small>
</header>

<section class="wallet">

  <small>共通所持ポイント</small>

  <div id="balance">接続中...</div>

  <small id="account"></small>

  <div>
    <a id="loginLink"
       class="login"
       href="./index.html"
       hidden>
      ログイン・新規登録
    </a>
  </div>

</section>

<section>

  <h2>🏁 レースカテゴリー</h2>

  <div class="categories">

    <a class="race boat" href="./index.html">

      <div class="emoji">🚤</div>

      <div class="name">競艇</div>

      <div class="english">BOAT RACE</div>

      <div class="enter">入場する ›</div>

    </a>

    <a class="race horse" href="./horse.html">

      <div class="emoji">🏇</div>

      <div class="name">競馬</div>

      <div class="english">HORSE RACE</div>

      <div class="enter">入場する ›</div>

    </a>

  </div>

</section>

<section>

  <h2>🏁 開催レース情報</h2>

  <div class="raceInfo">
    🚤 競艇
    <div id="boatRace">取得中...</div>
  </div>

  <div class="raceInfo">
    🏇 競馬
    <div id="horseRace">取得中...</div>
  </div>

</section>

<section>

  <h2>📢 運営からのお知らせ</h2>

  <div class="notice">

    ギャンギャンワールドへようこそ！<br>

    競艇・競馬の両方をお楽しみいただけます。<br>

    みんなで楽しくレースを楽しもう！<br><br>

    ※ゲーム内の仮想ポイント専用・換金不可。

  </div>

</section>

<footer>
  © GANG GANG WORLD 2026
</footer>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  onSnapshot
}
from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

const app=initializeApp({

  apiKey:"AIzaSyBhYaW-hDQcCL6sc8WNqz5glK1xZOJ-YL8",

  authDomain:"gang-gang-world.firebaseapp.com",

  projectId:"gang-gang-world",

  appId:"1:546523018840:web:8ca419709eff43f0d83c2d"

});

const auth=getAuth(app);
const db=getFirestore(app);

const el=id=>document.getElementById(id);

const fmt=n=>
  Number(n||0).toLocaleString("ja-JP");

let stops=[];

function watchRace(path,target){

  const stop=onSnapshot(

    doc(db,path,"current"),

    snapshot=>{

      if(!snapshot.exists()){

        el(target).textContent="レース未登録";

        return;

      }

      const r=snapshot.data();

      const title=[

        r.venue,

        r.raceNo ? r.raceNo+"R" : "",

        r.name || r.raceName || r.title

      ].filter(Boolean).join(" ");

      const statuses={

        open:"🟢 投票受付中",

        closed:"🔴 投票締切",

        finished:"🏆 結果確定",

        ready:"🟡 準備中"

      };

      const status=

        statuses[r.status] ||

        r.status ||

        "準備中";

      el(target).textContent=

        (title||"レース情報")+" ｜ "+status;

    },

    ()=>{

      el(target).textContent=

        "レース情報を取得できません";

    }

  );

  stops.push(stop);

}

onAuthStateChanged(auth,user=>{

  stops.forEach(stop=>stop());

  stops=[];

  el("account").textContent="";

  el("balance").textContent="取得中...";

  watchRace("races","boatRace");

  watchRace("horseRaces","horseRace");

  if(!user){

    el("balance").textContent="未ログイン";

    el("loginLink").hidden=false;

    return;

  }

  el("loginLink").hidden=true;

  el("account").textContent=

    user.email || "ログイン中";

  stops.push(onSnapshot(

    doc(db,"users",user.uid),

    snapshot=>{

      if(!snapshot.exists()){

        el("balance").textContent="未設定";

        return;

      }

      el("balance").textContent=

        fmt(snapshot.data().points)+" pt";

    },

    ()=>{

      el("balance").textContent="取得エラー";

    }

  ));

});

</script>

</body>
</html>
