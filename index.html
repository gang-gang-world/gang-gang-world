<body>

<h1>ギャンギャンワールド</h1>
<p>公式ボートレースゲーム</p>

<section id="loginArea">

<input id="email" type="email"
placeholder="メールアドレス">
<input id="password" type="password"
placeholder="パスワード（6文字以上）">
<button id="login">ログイン</button>
<button id="register">新規登録</button>
<p id="message"></p>
</section>

<section id="userArea" hidden>
<h2>マイページ</h2>
<p id="userName"></p>
<p id="role"></p>
<p>所持ポイント</p>
<p id="points">取得中...</p>
<button id="logout">ログアウト</button>
</section>

<section>
<h2>レース情報</h2>
<p id="status">接続確認中...</p>
<h3 id="raceTitle"></h3>
<div id="boats"></div>
<p id="resultView"></p>

<summary>3連単オッズ一覧</summary>

</details>
</section>

<section id="playArea" hidden>

<select id="mode">
<option>通常</option>
<option>ボックス</option>
<option>フォーメーション</option>
</select>

<div id="choices"></div>

<label>1点あたりのポイント
<input id="stake" type="number"
min="100" step="100" value="100">
</label>

<p id="total"></p>
<button id="submitTicket">投票確定</button>
<p id="playMessage"></p>

<h3>投票履歴</h3>
<div id="history"></div>

<h3>ポイントランキング</h3>
<div id="ranking"></div>

<section id="adminArea" hidden>
<h2>管理者メニュー</h2>
<p>管理者としてログイン中</p>

<h3>レース管理</h3>

<label>レース名
<input id="raceName" placeholder="優勝戦">
</label>

<label>開催場
<input id="venue" placeholder="住之江">
</label>

<label>レース番号
<input id="raceNo" type="number"
min="1" max="12" value="12">
</label>

<details>
<summary>3連単120通りのオッズ設定</summary>

min="1" step="0.1" value="10">

<div id="oddsInputs"></div>

<div id="resultInputs"></div>

<button id="finish">結果登録</button>
<button id="settle">未払戻しを処理</button>

<p id="adminMessage"></p>
</section>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

import {
  getFirestore,
  doc,
  onSnapshot,
  runTransaction,
  collection,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyBhYaW-hDQcCL6sc8WNqz5glK1xZOJ-YL8",
  authDomain: "gang-gang-world.firebaseapp.com",
  projectId: "gang-gang-world",
  appId: "1:546523018840:web:8ca419709eff43f0d83c2d"
});

const db = getFirestore(app);
const auth = getAuth(app);

const adminUID =
"w3ZZn1g16fT9wfep9rkMzt7VrPt2";

const INITIAL_POINTS = 100000;
const MIN_BET = 100;

const ref = doc(db,"races","current");
const el = id => document.getElementById(id);

const nums = [1,2,3,4,5,6];
const combos = [];

let currentRace = {};
let busy = false;
let listStops = [];
let unsubscribe = null;
let pointsUnsubscribe = null;
let authVersion = 0;

for(const a of nums){
  for(const b of nums){
    for(const c of nums){
      if(new Set([a,b,c]).size===3){
        combos.push(a+"-"+b+"-"+c);
      }
    }
  }
}

for(const n of nums){
  const label=document.createElement("label");
  label.textContent=n+"号艇";

  const input=document.createElement("input");
  input.id="boat"+n;
  input.placeholder="選手名";

  label.append(input);
  el("boatInputs").append(label);
}

for(const k of combos){
  const label=document.createElement("label");
  label.className="line";

  const span=document.createElement("span");
  span.textContent=k;

  const input=document.createElement("input");
  input.id="odd"+k;
  input.type="number";
  input.min="1";
  input.step="0.1";
  input.placeholder="未設定";

  label.append(span,input);
  el("oddsInputs").append(label);
}

for(const n of [1,2,3]){
  const label=document.createElement("label");
  label.textContent=n+"着";

  const select=document.createElement("select");
  select.id="res"+n;

  for(const x of nums){
    const option=document.createElement("option");
    option.value=x;
    option.textContent=x+"号艇";
    select.append(option);
  }

  select.value=n;
  label.append(select);
  el("resultInputs").append(label);
}

function showError(e){
  const errors={
    "auth/email-already-in-use":
      "このメールアドレスは登録済みです。",
    "auth/invalid-email":
      "メールアドレスを確認してください。",
    "auth/weak-password":
      "パスワードは6文字以上にしてください。",
    "auth/invalid-credential":
      "メールアドレスかパスワードが違います。"
  };

  el("message").textContent=
    errors[e.code]||e.message;
}

el("register").onclick=async()=>{
  try{
    await createUserWithEmailAndPassword(
      auth,
      el("email").value.trim(),
      el("password").value
    );
  }catch(e){
    showError(e);
  }
};

el("login").onclick=async()=>{
  try{
    await signInWithEmailAndPassword(
      auth,
      el("email").value.trim(),
      el("password").value
    );
  }catch(e){
    showError(e);
  }
};

el("logout").onclick=async()=>{
  try{
    await signOut(auth);
  }catch(e){
    alert(e.message);
  }
};

function fillForm(r){
  el("raceName").value=r.name||"";
  el("venue").value=r.venue||"";
  el("raceNo").value=r.raceNo||12;

  nums.forEach((n,i)=>{
    el("boat"+n).value=r.boats?.[i]||"";
  });

  combos.forEach(k=>{
    el("odd"+k).value=r.odds?.[k]??"";
  });

  [1,2,3].forEach((n,i)=>{
    el("res"+n).value=r.result?.[i]||n;
  });
}

function renderRace(r){

  currentRace=r;
  updateTotal();

  el("status").textContent=
    r.status||"レース未登録";

  el("raceTitle").textContent=[
    r.venue,
    r.raceNo?r.raceNo+"R":"",
    r.name
  ].filter(Boolean).join(" ");

  el("boats").replaceChildren();

  const colors=[
    "white",
    "#888888",
    "#ff5555",
    "#70aaff",
    "#ffe65c",
    "#65cf86"
  ];

  (r.boats||[]).forEach((name,i)=>{
    const div=document.createElement("div");

    div.className="boat";
    div.style.background=colors[i];
    div.textContent=(i+1)+"号艇 "+name;

    el("boats").append(div);
  });

  el("resultView").textContent=
    r.result?"結果："+r.result.join("-"):"";

  el("oddsView").replaceChildren();

  for(const k of combos){
    if(r.odds?.[k]!=null){
      const div=document.createElement("div");

      div.textContent=k+"　"+r.odds[k]+"倍";

      el("oddsView").append(div);
    }
  }

  el("publicOdds").hidden=
    !Object.keys(r.odds||{}).length;

  if(auth.currentUser?.uid===adminUID){
    fillForm(r);
  }
}

async function loadPoints(user,version){

  const userRef=doc(db,"users",user.uid);

  try{

    await runTransaction(db,async t=>{
      const snapshot=await t.get(userRef);

      if(!snapshot.exists()){
        t.set(userRef,{
          points:INITIAL_POINTS
        });
      }
    });

    if(
      auth.currentUser?.uid!==user.uid||
      version!==authVersion
    )return;

    pointsUnsubscribe=onSnapshot(
      userRef,
      snapshot=>{
        if(version!==authVersion)return;

        const points=snapshot.data()?.points??0;

        el("points").textContent=
          points.toLocaleString()+" pt";
      },
      e=>{
        if(version!==authVersion)return;

        el("points").textContent=
          "取得エラー："+e.code;
      }
    );

  }catch(e){
    if(version!==authVersion)return;

    el("points").textContent=
      "ポイントエラー："+e.code;
  }
}

onAuthStateChanged(auth,user=>{

  const version=++authVersion;

  if(unsubscribe){
    unsubscribe();
    unsubscribe=null;
  }

  if(pointsUnsubscribe){
    pointsUnsubscribe();
    pointsUnsubscribe=null;
  }

  el("loginArea").hidden=!!user;
  el("userArea").hidden=!user;
  el("playArea").hidden=!user;

  watchLists(user);

  el("adminArea").hidden=
    user?.uid!==adminUID;

  el("message").textContent="";
  el("points").textContent="取得中...";

  if(user){

    el("userName").textContent=user.email;

    el("role").textContent=
      user.uid===adminUID
      ?"管理者"
      :"一般参加者";

    el("password").value="";

    loadPoints(user,version);
  }

  unsubscribe=onSnapshot(
    ref,
    snapshot=>{
      renderRace(
        snapshot.exists()?snapshot.data():{}
      );
    },
    e=>{
      el("status").textContent=
        "接続エラー："+e.code;
    }
  );
});

function formData(){

  const name=el("raceName").value.trim();
  const venue=el("venue").value.trim();
  const raceNo=Number(el("raceNo").value);

  const boats=nums.map(n=>
    el("boat"+n).value.trim()
  );

  const odds={};

  if(
    !name||
    !venue||
    !Number.isInteger(raceNo)||
    raceNo<1||
    raceNo>12||
    boats.some(x=>!x)
  ){
    throw Error(
      "レース情報と全選手名を入力してください。"
    );
  }

  for(const k of combos){

    const value=el("odd"+k).value;

    if(value===""){
      throw Error(
        "120通りのオッズを設定してください。"
      );
    }

    const x=Number(value);

    if(!Number.isFinite(x)||x<1){
      throw Error(
        "オッズは1倍以上にしてください。"
      );
    }

    odds[k]=x;
  }

  return {
    name,
    venue,
    raceNo,
    boats,
    odds
  };
}

function action(id,fn){

  el(id).onclick=async()=>{

    if(auth.currentUser?.uid!==adminUID){
      return;
    }

    el(id).disabled=true;

    try{

      await fn();

      el("adminMessage").textContent=
        "更新しました！";

    }catch(e){

      el("adminMessage").textContent=e.message;

    }finally{

      el(id).disabled=false;
    }
  };
}

async function change(fn){

  await runTransaction(db,async t=>{

    const snapshot=await t.get(ref);

    const r=snapshot.exists()
      ?snapshot.data()
      :{};

    t.set(ref,fn(r));
  });
}

action("save",async()=>{

  const data=formData();

  await change(r=>{

    if(
      ["受付中","締切","確定"].includes(r.status)
    ){
      throw Error(
        "準備中のみ編集できます。"
      );
    }

    return {
      ...data,
      status:"準備中",
      result:null
    };
  });
});

action("open",async()=>{

  await change(r=>{

    if(
      r.status!=="準備中"||
      !r.name||
      !r.venue||
      r.boats?.length!==6||
      Object.keys(r.odds||{}).length!==120
    ){
      throw Error(
        "全120通りのオッズとレース情報を保存してください。"
      );
    }

    return {
      ...r,
      status:"受付中",
      round:crypto.randomUUID()
    };
  });
});

action("close",async()=>{

  await change(r=>{

    if(r.status!=="受付中"){
      throw Error("受付中のみ締切できます。");
    }

    return {
      ...r,
      status:"締切"
    };
  });
});

action("finish",async()=>{

  const result=[1,2,3].map(n=>
    Number(el("res"+n).value)
  );

  if(new Set(result).size!==3){
    throw Error("同じ号艇は選べません。");
  }

  await change(r=>{

    if(r.status!=="締切"){
      throw Error(
        "先に投票を締め切ってください。"
      );
    }

    return {
      ...r,
      status:"確定",
      result
    };
  });
});

action("reset",async()=>{

  const rs=await getDocs(
    query(
      collection(db,"tickets"),
      where("settled","==",false)
    )
  );

  if(!rs.empty){
    throw Error(
      "先に未払戻しを処理してください。"
    );
  }

  if(!confirm("現在のレース情報を消去しますか？")){
    throw Error("キャンセルしました。");
  }

  await change(r=>{

    if(
      r.status&&
      r.status!=="確定"&&
      r.status!=="準備中"
    ){
      throw Error(
        "先にレースを確定してください。"
      );
    }

    return {
      status:"準備中",
      boats:[],
      odds:{},
      result:null
    };
  });
});

el("autoOdds").onclick=()=>{

  if(auth.currentUser?.uid!==adminUID)return;

  const weights=[
    0.42,0.20,0.15,
    0.10,0.08,0.05
  ];

  for(const k of combos){

    const [a,b,c]=k.split("-").map(Number);

    const p1=weights[a-1];

    const p2=
      weights[b-1]/(1-p1);

    const p3=
      weights[c-1]/
      (1-p1-weights[b-1]);

    const probability=p1*p2*p3;

    const odds=Math.max(1,0.75/probability);

    el("odd"+k).value=odds.toFixed(1);
  }

  el("oddsMessage").textContent=
    "120通りのオッズを自動生成しました！";
};

el("bulkSet").onclick=()=>{

  if(auth.currentUser?.uid!==adminUID)return;

  const value=Number(el("bulkOdds").value);

  if(!Number.isFinite(value)||value<1){
    alert("1倍以上を入力してください。");
    return;
  }

  for(const k of combos){
    el("odd"+k).value=value.toFixed(1);
  }

  el("oddsMessage").textContent=

function drawChoices(){

  el("choices").replaceChildren();

  const mode=el("mode").value;

  for(let i=0;i<(mode==="ボックス"?1:3);i++){

function keys(){

  const pick=i=>Array.from(
    document.querySelectorAll(
      'input[name="pick'+i+'"]:checked'
    ),
    x=>x.value
  );

  const a=pick(0);

  const b=el("mode").value==="ボックス"
    ?a:pick(1);

  const c=el("mode").value==="ボックス"
    ?a:pick(2);

  return combos.filter(k=>{

    const [x,y,z]=k.split("-");

    return a.includes(x)&&
      b.includes(y)&&
      c.includes(z);
  });
}

function updateTotal(){

  const k=keys();
  const n=Number(el("stake").value);

  el("total").textContent=
    k.length+"点 / 合計 "+
    (k.length*n).toLocaleString()+"pt";

  el("submitTicket").disabled=
    busy||
    currentRace.status!=="受付中"||
    !currentRace.round||
    !k.length||
    !Number.isSafeInteger(n)||
    n<MIN_BET;
}

el("mode").onchange=drawChoices;

drawChoices();

el("submitTicket").onclick=async()=>{

  const user=auth.currentUser;
  const list=keys();
  const stake=Number(el("stake").value);
  const round=currentRace.round;

  if(
    !user||
    busy||
    !Number.isSafeInteger(stake)||
    stake<MIN_BET||
    !list.length||
    !round
  )return;

  if(!confirm(
    list.length+"点を順番に登録します。途中で失敗すると一部だけ成立する場合があります。続けますか？"
  ))return;

  busy=true;
  updateTotal();

  let done=0;

  try{

    const u=doc(db,"users",user.uid);

    for(const key of list){

      const tRef=doc(collection(db,"tickets"));

      await runTransaction(db,async t=>{

        const r=(await t.get(ref)).data();

        const balance=
          (await t.get(u)).data().points;

        if(
          r.status!=="受付中"||
          r.round!==round
        ){
          throw Error("受付終了");
        }

        if(balance<stake*(list.length-done)){
          throw Error("ポイント不足");
        }

        const odds=r.odds[key];

        if(!Number.isFinite(odds)||odds<1){
          throw Error("オッズ未設定");
        }

        t.set(tRef,{
          uid:user.uid,
          round,
          key,
          stake,
          odds,
          settled:false
        });

        t.update(u,{
          points:balance-stake,
          lastTicket:tRef.id
        });
      });

      done++;
    }

    el("playMessage").textContent=
      done+"点登録完了";

  }catch(e){

    el("playMessage").textContent=
      done+"点成立 / "+e.message;

  }finally{

    busy=false;
    updateTotal();
  }
};

action("settle",async()=>{

  const snap=await getDocs(
    query(
      collection(db,"tickets"),
      where("settled","==",false)
    )
  );

  for(const d of snap.docs){

    await runTransaction(db,async t=>{

      const r=(await t.get(ref)).data();

      const ticket=
        (await t.get(d.ref)).data();

      if(ticket.settled)return;

      if(
        r.status!=="確定"||
        r.round!==ticket.round||
        !r.result
      ){
        throw Error(
          "対象レースが未確定です"
        );
      }

      const u=doc(db,"users",ticket.uid);

      const balance=
        (await t.get(u)).data().points;

      const payout=
        ticket.key===r.result.join("-")
        ?Math.round(ticket.stake*ticket.odds)
        :0;

      if(!Number.isSafeInteger(payout+balance)){
        throw Error("ポイント上限エラー");
      }

      t.update(u,{
        points:balance+payout
      });

      t.update(d.ref,{
        settled:true,
        payout
      });
    });
  }
});

      list.textContent = "参加者がいません";
    }

    players.forEach((p,i) => {
      const colors = ["#f5cf65","#c0c0c0","#cd7f32"];
      const medals = ["👑","🥈","🥉"];
      const color = colors[i] || "#ffffff";

      const card = document.createElement("div");

      card.style.cssText = `
        background:#1b2230;
        border:1px solid ${i<3?color:"#30394a"};
        border-radius:12px;
        padding:15px;
        margin:10px 0;
        text-align:left;
      `;

      const name = document.createElement("div");

      name.style.cssText = `
        font-size:18px;
        font-weight:bold;
        color:${color};
        overflow-wrap:anywhere;
      `;

      name.textContent =
        (medals[i] || "") +
        " 第"+(i+1)+"位　"+p.name;

      const points = document.createElement("div");

      points.style.cssText = `
        color:#f5cf65;
        font-size:24px;
        font-weight:bold;
        margin-top:8px;
      `;

      points.textContent =
        p.points.toLocaleString()+" pt";

      card.append(name,points);
      list.appendChild(card);
    });

  } catch(e) {
    list.textContent = "取得エラー："+e.message;
  }
}

// 譲渡履歴をニックネーム表示
let worldNicknameMap = new Map();

async function refreshWorldNicknames() {
  if (!rankingAuth().currentUser) return;

  try {
    const profiles = await rankingGetDocs(
      rankingCollection(rankingDB, "profiles")
    );

    worldNicknameMap = new Map();

    profiles.forEach(p => {
      worldNicknameMap.set(p.id, p.data().nickname);
    });

    replaceWorldHistoryNames();
  } catch(e) {
    console.error(e);
  }
}

function replaceWorldHistoryNames() {
  if (!rankingAuth().currentUser) return;

  const walker = document.createTreeWalker(
    document.body,
    NodeFilter.SHOW_TEXT
  );

  let node;

  while ((node = walker.nextNode())) {
    if (node.parentElement.closest(
      "script,style,input,textarea"
    )) continue;

    const match = node.nodeValue.match(
      /^\s*([A-Za-z0-9]{20,128})\s*→\s*([A-Za-z0-9]{20,128})\s*$/
    );

    if (!match) continue;

    const from = worldNicknameMap.get(match[1])
      || "名前未登録";

    const to = worldNicknameMap.get(match[2])
      || "名前未登録";

    node.nodeValue = from + " → " + to;
  }
}

const worldHistoryObserver = new MutationObserver(() => {
  replaceWorldHistoryNames();
});

worldHistoryObserver.observe(document.body, {
  childList: true,
  subtree: true
});

rankingAuth().onAuthStateChanged(user => {
  worldNicknameMap.clear();

  if (user) {
    refreshWorldNicknames();
  }
});

document.addEventListener("click", event => {
  const button = event.target.closest("button");

  if (!button) return;

  if (
    button.textContent.includes("譲渡履歴を更新") ||
    button.textContent.includes("名前を登録・変更")
  ) {
    setTimeout(refreshWorldNicknames, 1500);
  }
});

  const summary = document.createElement("summary");

  summary.textContent = "👤 ニックネーム設定・変更";
  summary.style.cssText = `

  `;

  details.appendChild(summary);

  while (panel.firstChild) {
    details.appendChild(panel.firstChild);
  }

  panel.appendChild(details);
}
