<!DOCTYPE html>

<head>

<style>

/* GANG GANG WORLD PREMIUM DESIGN */

body {

section:first-of-type {

html {

body {

}

#userArea {

#userArea h2,
#userName {

<body>

<h1>ギャンギャンワールド</h1>
<p>公式ボートレースゲーム</p>

<section id="loginArea">
<h2>ログイン・新規登録</h2>
<input id="email" type="email"
placeholder="メールアドレス">
<input id="password" type="password"
placeholder="パスワード（6文字以上）">
<button id="login">ログイン</button>
<button id="register">新規登録</button>
<p id="message"></p>
</section>

<section id="userArea" hidden>
<h2>マイページ</h2>
<p id="userName"></p>
<p id="role"></p>
<p>所持ポイント</p>
<p id="points">取得中...</p>
<button id="logout">ログアウト</button>
</section>

<section>
<h2>レース情報</h2>
<p id="status">接続確認中...</p>
<h3 id="raceTitle"></h3>
<div id="boats"></div>
<p id="resultView"></p>
<details id="publicOdds" hidden>
<summary>3連単オッズ一覧</summary>
<div id="oddsView"></div>
</details>
</section>

<section id="playArea" hidden>
<h2>3連単 ポイント投票</h2>
<p>ゲーム内ポイント専用・換金不可。新規レースは締切時の確定オッズで払戻します。</p>

<select id="mode">
<option>通常</option>
<option>ボックス</option>
<option>フォーメーション</option>
</select>

<div id="choices"></div>

<label>1点あたりのポイント
<input id="stake" type="number"
min="100" step="100" value="100">
</label>

<p id="total"></p>
<button id="submitTicket">投票確定</button>
<p id="playMessage"></p>

<h3>投票履歴</h3>
<div id="history"></div>

<h3>ポイントランキング</h3>
<div id="ranking"></div>
</section>

<section id="adminArea" hidden>
<h2>管理者メニュー</h2>
<p>管理者としてログイン中</p>

<h3>レース管理</h3>

<label>レース名
<input id="raceName" placeholder="優勝戦">
</label>

<label>開催場
<input id="venue" placeholder="住之江">
</label>

<label>レース番号
<input id="raceNo" type="number"
min="1" max="12" value="12">
</label>

<h3>出走選手</h3>
<div id="boatInputs"></div>

<details>
<summary>3連単120通りのオッズ設定</summary>

<button id="autoOdds">オッズ自動生成</button>

<input id="bulkOdds" type="number"
min="1" step="0.1" value="10">

<button id="bulkSet">オッズ一括設定</button>

<p id="oddsMessage"></p>
<div id="oddsInputs"></div>
</details>

<button id="save">レース情報を保存</button>
<button id="open">投票受付開始</button>
<button id="close">投票締切</button>

<h3>レース結果</h3>
<div id="resultInputs"></div>

<button id="finish">結果登録</button>
<button id="settle">未払戻しを処理</button>
<button id="reset">次のレースを準備</button>

<p id="adminMessage"></p>
<details><summary>全参加者の投票・収支</summary>
<button id="auditRefresh">履歴を更新</button><div id="auditView"></div></details>
</section>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

import {
  getFirestore,
  doc,
  onSnapshot,
  runTransaction,
  collection,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyBhYaW-hDQcCL6sc8WNqz5glK1xZOJ-YL8",
  authDomain: "gang-gang-world.firebaseapp.com",
  projectId: "gang-gang-world",
  appId: "1:546523018840:web:8ca419709eff43f0d83c2d"
});

const db = getFirestore(app);
const auth = getAuth(app);

const adminUID =
"w3ZZn1g16fT9wfep9rkMzt7VrPt2";

const INITIAL_POINTS = 100000;
const MIN_BET = 100;

const ref = doc(db,"races","current");
const el = id => document.getElementById(id);

const nums = [1,2,3,4,5,6];
const combos = [];

let currentRace = {};
let busy = false;
let listStops = [];
let unsubscribe = null;
let pointsUnsubscribe = null;
let authVersion = 0;

for(const a of nums){
  for(const b of nums){
    for(const c of nums){
      if(new Set([a,b,c]).size===3){
        combos.push(a+"-"+b+"-"+c);
      }
    }
  }
}

for(const n of nums){
  const label=document.createElement("label");
  label.textContent=n+"号艇";

  const input=document.createElement("input");
  input.id="boat"+n;
  input.placeholder="選手名";

  label.append(input);
  el("boatInputs").append(label);
}

for(const k of combos){
  const label=document.createElement("label");
  label.className="line";

  const span=document.createElement("span");
  span.textContent=k;

  const input=document.createElement("input");
  input.id="odd"+k;
  input.type="number";
  input.min="1";
  input.step="0.1";
  input.placeholder="未設定";

  label.append(span,input);
  el("oddsInputs").append(label);
}

for(const n of [1,2,3]){
  const label=document.createElement("label");
  label.textContent=n+"着";

  const select=document.createElement("select");
  select.id="res"+n;

  for(const x of nums){
    const option=document.createElement("option");
    option.value=x;
    option.textContent=x+"号艇";
    select.append(option);
  }

  select.value=n;
  label.append(select);
  el("resultInputs").append(label);
}

function showError(e){
  const errors={
    "auth/email-already-in-use":
      "このメールアドレスは登録済みです。",
    "auth/invalid-email":
      "メールアドレスを確認してください。",
    "auth/weak-password":
      "パスワードは6文字以上にしてください。",
    "auth/invalid-credential":
      "メールアドレスかパスワードが違います。"
  };

  el("message").textContent=
    errors[e.code]||e.message;
}

el("register").onclick=async()=>{
  try{
    await createUserWithEmailAndPassword(
      auth,
      el("email").value.trim(),
      el("password").value
    );
  }catch(e){
    showError(e);
  }
};

el("login").onclick=async()=>{
  try{
    await signInWithEmailAndPassword(
      auth,
      el("email").value.trim(),
      el("password").value
    );
  }catch(e){
    showError(e);
  }
};

el("logout").onclick=async()=>{
  try{
    await signOut(auth);
  }catch(e){
    alert(e.message);
  }
};

function fillForm(r){
  el("raceName").value=r.name||"";
  el("venue").value=r.venue||"";
  el("raceNo").value=r.raceNo||12;

  nums.forEach((n,i)=>{
    el("boat"+n).value=r.boats?.[i]||"";
  });

  combos.forEach(k=>{
    el("odd"+k).value=r.odds?.[k]??"";
  });

  [1,2,3].forEach((n,i)=>{
    el("res"+n).value=r.result?.[i]||n;
  });
}

function renderRace(r){

  currentRace=r;
  updateTotal();

  el("status").textContent=
    r.status||"レース未登録";

  el("raceTitle").textContent=[
    r.venue,
    r.raceNo?r.raceNo+"R":"",
    r.name
  ].filter(Boolean).join(" ");

  el("boats").replaceChildren();

  const colors=[
    "white",
    "#888888",
    "#ff5555",
    "#70aaff",
    "#ffe65c",
    "#65cf86"
  ];

  (r.boats||[]).forEach((name,i)=>{
    const div=document.createElement("div");

    div.className="boat";
    div.style.background=colors[i];
    div.textContent=(i+1)+"号艇 "+name;

    el("boats").append(div);
  });

  el("resultView").textContent=
    r.result?"結果："+r.result.join("-"):"";

  el("oddsView").replaceChildren();

  for(const k of combos){
    if((r.finalOdds || r.odds)?.[k]!=null){
      const div=document.createElement("div");

      div.textContent=k+"　"+(r.finalOdds || r.odds)[k]+"倍";

      el("oddsView").append(div);
    }
  }

  el("publicOdds").hidden=
    !Object.keys(r.odds||{}).length;

  if(auth.currentUser?.uid===adminUID){
    fillForm(r);
  }
}

async function loadPoints(user,version){

  const userRef=doc(db,"users",user.uid);

  try{

    await runTransaction(db,async t=>{
      const snapshot=await t.get(userRef);

      if(!snapshot.exists()){
        t.set(userRef,{
          points:INITIAL_POINTS
        });
      }
    });

    if(
      auth.currentUser?.uid!==user.uid||
      version!==authVersion
    )return;

    pointsUnsubscribe=onSnapshot(
      userRef,
      snapshot=>{
        if(version!==authVersion)return;

        const points=snapshot.data()?.points??0;

        el("points").textContent=
          points.toLocaleString()+" pt";
      },
      e=>{
        if(version!==authVersion)return;

        el("points").textContent=
          "取得エラー："+e.code;
      }
    );

  }catch(e){
    if(version!==authVersion)return;

    el("points").textContent=
      "ポイントエラー："+e.code;
  }
}

onAuthStateChanged(auth,user=>{

  const version=++authVersion;

  if(unsubscribe){
    unsubscribe();
    unsubscribe=null;
  }

  if(pointsUnsubscribe){
    pointsUnsubscribe();
    pointsUnsubscribe=null;
  }

  el("loginArea").hidden=!!user;
  el("userArea").hidden=!user;
  el("playArea").hidden=!user;

  watchLists(user);

  el("adminArea").hidden=
    user?.uid!==adminUID;

  el("message").textContent="";
  el("points").textContent="取得中...";

  if(user){

    el("userName").textContent=user.email;

    el("role").textContent=
      user.uid===adminUID
      ?"管理者"
      :"一般参加者";

    el("password").value="";

    loadPoints(user,version);
  }

  unsubscribe=onSnapshot(
    ref,
    snapshot=>{
      renderRace(
        snapshot.exists()?snapshot.data():{}
      );
    },
    e=>{
      el("status").textContent=
        "接続エラー："+e.code;
    }
  );
});

function formData(){

  const name=el("raceName").value.trim();
  const venue=el("venue").value.trim();
  const raceNo=Number(el("raceNo").value);

  const boats=nums.map(n=>
    el("boat"+n).value.trim()
  );

  const odds={};

  if(
    !name||
    !venue||
    !Number.isInteger(raceNo)||
    raceNo<1||
    raceNo>12||
    boats.some(x=>!x)
  ){
    throw Error(
      "レース情報と全選手名を入力してください。"
    );
  }

  for(const k of combos){

    const value=el("odd"+k).value;

    if(value===""){
      throw Error(
        "120通りのオッズを設定してください。"
      );
    }

    const x=Number(value);

    if(!Number.isFinite(x)||x<1){
      throw Error(
        "オッズは1倍以上にしてください。"
      );
    }

    odds[k]=x;
  }

  return {
    name,
    venue,
    raceNo,
    boats,
    odds
  };
}

function action(id,fn){

  el(id).onclick=async()=>{

    if(auth.currentUser?.uid!==adminUID){
      return;
    }

    el(id).disabled=true;

    try{

      await fn();

      el("adminMessage").textContent=
        "更新しました！";

    }catch(e){

      el("adminMessage").textContent=e.message;

    }finally{

      el(id).disabled=false;
    }
  };
}

async function change(fn){

  await runTransaction(db,async t=>{

    const snapshot=await t.get(ref);

    const r=snapshot.exists()
      ?snapshot.data()
      :{};

    t.set(ref,fn(r));
  });
}

action("save",async()=>{

  const data=formData();

  await change(r=>{

    if(
      ["受付中","締切","確定"].includes(r.status)
    ){
      throw Error(
        "準備中のみ編集できます。"
      );
    }

    return {
      ...data,
      status:"準備中",
      result:null
    };
  });
});

action("open",async()=>{

  await change(r=>{

    if(
      r.status!=="準備中"||
      !r.name||
      !r.venue||
      r.boats?.length!==6||
      Object.keys(r.odds||{}).length!==120
    ){
      throw Error(
        "全120通りのオッズとレース情報を保存してください。"
      );
    }

    return {
      ...r,
      status:"受付中",
      round:crypto.randomUUID(),
      dynamicOdds:true
    };
  });
});

action("close",async()=>{
  await change(r=>{
    if(r.status!=="受付中") throw Error("受付中のみ締切できます。");
    return {...r,status:"締切"};
  });
  await freezeOdds();
});
async function freezeOdds(){
  const round=currentRace.round;
  const snap=await getDocs(query(collection(db,"tickets"),where("round","==",round)));
  const totals={}; let total=0;
  snap.forEach(d=>{const t=d.data(); totals[t.key]=(totals[t.key]||0)+t.stake; total+=t.stake;});
  await change(r=>{
    if(r.status!=="締切" || r.round!==round) throw Error("対象レースが変わりました");
    if(!r.dynamicOdds || r.finalOdds) return r;
    const finalOdds={};
    for(const k of combos){
      const base=r.odds[k];
      finalOdds[k]=Math.max(5,Math.floor(10*(base*10000+total*0.75)/(10000+base*(totals[k]||0)))/10);
    }
    return {...r,finalOdds};
  });
}
const retryOdds=document.createElement("button");
retryOdds.id="retryOdds"; retryOdds.textContent="確定オッズを再計算";
el("close").after(retryOdds);
action("retryOdds",freezeOdds);

action("finish",async()=>{

  const result=[1,2,3].map(n=>
    Number(el("res"+n).value)
  );

  if(new Set(result).size!==3){
    throw Error("同じ号艇は選べません。");
  }

  await change(r=>{

    if(r.status!=="締切" || (r.dynamicOdds && !r.finalOdds)){
      throw Error(
        "先に投票を締め切ってください。"
      );
    }

    return {
      ...r,
      status:"確定",
      result
    };
  });
});

action("reset",async()=>{

  const rs=await getDocs(
    query(
      collection(db,"tickets"),
      where("settled","==",false)
    )
  );

  if(!rs.empty){
    throw Error(
      "先に未払戻しを処理してください。"
    );
  }

  if(!confirm("現在のレース情報を消去しますか？")){
    throw Error("キャンセルしました。");
  }

  await change(r=>{

    if(
      r.status&&
      r.status!=="確定"&&
      r.status!=="準備中"
    ){
      throw Error(
        "先にレースを確定してください。"
      );
    }

el("autoOdds").onclick=()=>{

  if(auth.currentUser?.uid!==adminUID)return;

  const weights=[
    0.42,0.20,0.15,
    0.10,0.08,0.05
  ];

  for(const k of combos){

    const [a,b,c]=k.split("-").map(Number);

    const p1=weights[a-1];

    const p2=
      weights[b-1]/(1-p1);

    const p3=
      weights[c-1]/
      (1-p1-weights[b-1]);

    const probability=p1*p2*p3;

    const odds=Math.max(1,0.75/probability);

    el("odd"+k).value=odds.toFixed(1);
  }

  el("oddsMessage").textContent=
    "120通りのオッズを自動生成しました！";
};

function keys(){

  const pick=i=>Array.from(
    document.querySelectorAll(
      'input[name="pick'+i+'"]:checked'
    ),
    x=>x.value

  const a=pick(0);

  const b=el("mode").value==="ボックス"
    ?a:pick(1);

  const c=el("mode").value==="ボックス"
    ?a:pick(2);

  return combos.filter(k=>{

    const [x,y,z]=k.split("-");

    return a.includes(x)&&
      b.includes(y)&&
      c.includes(z);
  });
}

}

el("submitTicket").onclick=async()=>{

  const user=auth.currentUser;
  const list=keys();
  const stake=Number(el("stake").value);
  const round=currentRace.round;

  if(
    !user||
    busy||
    !Number.isSafeInteger(stake)||
    stake<MIN_BET||
    !list.length||
    !round
  )return;

  if(!confirm(
    list.length+"点を順番に登録します。途中で失敗すると一部だけ成立する場合があります。続けますか？"
  ))return;

  busy=true;
  updateTotal();

  let done=0;

  try{

    const u=doc(db,"users",user.uid);

    for(const key of list){

      const tRef=doc(collection(db,"tickets"));

      await runTransaction(db,async t=>{

        const r=(await t.get(ref)).data();

        const balance=
          (await t.get(u)).data().points;

        if(
          r.status!=="受付中"||
          r.round!==round
        ){
          throw Error("受付終了");
        }

        if(balance<stake*(list.length-done)){
          throw Error("ポイント不足");
        }

        const odds=r.odds[key];

        if(!Number.isFinite(odds)||odds<1){
          throw Error("オッズ未設定");
        }

        t.set(tRef,{
          uid:user.uid,
          round,
          key,
          stake,
          odds,
          settled:false
        });

        t.update(u,{
          points:balance-stake,
          lastTicket:tRef.id
        });
      });

      done++;
    }

    el("playMessage").textContent=
      done+"点登録完了";

  }catch(e){

    el("playMessage").textContent=
      done+"点成立 / "+e.message;

  }finally{

    busy=false;
    updateTotal();
  }
};

action("settle",async()=>{

  const snap=await getDocs(
    query(
      collection(db,"tickets"),
      where("settled","==",false)
    )
  );

  for(const d of snap.docs){

    await runTransaction(db,async t=>{

      const r=(await t.get(ref)).data();

      const ticket=
        (await t.get(d.ref)).data();

      if(ticket.settled)return;

      if(
        r.status!=="確定"||
        r.round!==ticket.round||
        !r.result
      ){
        throw Error(
          "対象レースが未確定です"
        );
      }

      const u=doc(db,"users",ticket.uid);

      const balance=
        (await t.get(u)).data().points;

      const payout=
        ticket.key===r.result.join("-")
        ?Math.round(ticket.stake*(r.dynamicOdds ? r.finalOdds[ticket.key] : ticket.odds))
        :0;

      if(!Number.isSafeInteger(payout+balance)){
        throw Error("ポイント上限エラー");
      }

      t.update(u,{
        points:balance+payout
      });

      t.update(d.ref,{
        settled:true,
        payout,
        finalOdds:r.dynamicOdds ? r.finalOdds[ticket.key] : ticket.odds
      });
    });
  }
});

async function refreshWorldNicknames() {
  if (!rankingAuth().currentUser) return;

  try {
    const profiles = await rankingGetDocs(
      rankingCollection(rankingDB, "profiles")
    );

    worldNicknameMap = new Map();

    profiles.forEach(p => {
      worldNicknameMap.set(p.id, p.data().nickname);
    });

    replaceWorldHistoryNames();
  } catch(e) {
    console.error(e);
  }
}

function replaceWorldHistoryNames() {
  if (!rankingAuth().currentUser) return;

  const walker = document.createTreeWalker(
    document.body,
    NodeFilter.SHOW_TEXT
  );

  let node;

  while ((node = walker.nextNode())) {
    if (node.parentElement.closest(
      "script,style,input,textarea"
    )) continue;

    const match = node.nodeValue.match(
      /^\s*([A-Za-z0-9]{20,128})\s*→\s*([A-Za-z0-9]{20,128})\s*$/
    );

    if (!match) continue;

    const from = worldNicknameMap.get(match[1])
      || "名前未登録";

    const to = worldNicknameMap.get(match[2])
      || "名前未登録";

    node.nodeValue = from + " → " + to;
  }
}

const worldHistoryObserver = new MutationObserver(() => {
  replaceWorldHistoryNames();
});

worldHistoryObserver.observe(document.body, {
  childList: true,
  subtree: true
});

<script type="module">
import { getApp } from
"https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

const app = getApp();

const db = getFirestore(app);

const adminUID =

const panel = document.createElement("div");

panel.hidden = true;

panel.style.cssText = `

async function loadGrantHistory() {

  if (!isAdmin()) return;

  const area = el("grantHistory");

  area.textContent = "取得中...";

  try {

    const [snap, profiles] = await Promise.all([
      getDocs(collection(db, "pointGrants")),

    ]);

    if (!isAdmin()) return;

    const names = new Map();

    profiles.forEach(p => {

    const records = snap.docs.sort((a,b) =>

    );

    if (!records.length) {

      return;
    }

    records.forEach(record => {

      const card = document.createElement("div");

  panel.hidden = user?.uid !== adminUID;

  el("grantHistory").replaceChildren();

  el("grantMessage").textContent = "";

  if (!panel.hidden) {
    loadGrantHistory();
  }

el("grantRefresh").onclick = loadGrantHistory;

let granting = false;

el("grantButton").onclick = async () => {

  if (!isAdmin() || granting) return;

  const name = el("grantName").value.trim();

  const amount = Number(el("grantAmount").value);

  const reason = el("grantReason").value.trim();

  const msg = el("grantMessage");

  if (
    name.length < 2 ||
    name.length > 20 ||
    name.includes("/") ||
    name === ".." ||
    /^__.*__$/.test(name)
  ) {
    msg.textContent =
      "ニックネームを確認してください";
    return;
  }

  if (
    !Number.isSafeInteger(amount) ||
    amount < 1
  ) {
    msg.textContent =
      "正しいポイント数を入力してください";
    return;
  }

  if (!reason) {
    msg.textContent =
      "発行理由を入力してください";
    return;
  }

  if (!confirm(
    name + " さんに\n" +
    amount.toLocaleString() +
    " ptを発行しますか？\n理由：" + reason
  )) return;

  granting = true;

  el("grantButton").disabled = true;

  msg.textContent = "発行処理中...";

  try {

    const log = doc(collection(db,"pointGrants"));

    await runTransaction(db, async t => {

      if (!isAdmin()) {
        throw Error("管理者権限がありません");
      }

      const nickname = await t.get(
        doc(db,"nicknames",name)
      );

      if (!nickname.exists()) {
        throw Error("参加者が見つかりません");
      }

      const uid = nickname.data().uid;

      const target = doc(db,"users",uid);

      const player = await t.get(target);

      if (!player.exists()) {
        throw Error("参加者が存在しません");
      }

      const balance = player.data().points;

      if (
        !Number.isSafeInteger(balance) ||
        !Number.isSafeInteger(balance + amount)
      ) {
        throw Error("ポイント上限エラー");
      }

      t.update(target,{
        points:balance + amount
      });

      t.set(log,{
        uid:uid,
        amount:amount,
        reason:reason,
        createdAt:serverTimestamp()
      });

    });

    msg.textContent =
      "🎉 " + name + " さんに " +
      amount.toLocaleString() +
      " ptを発行しました！";

    el("grantName").value = "";
    el("grantAmount").value = "";
    el("grantReason").value = "";

    await loadGrantHistory();

  } catch(e) {

    msg.textContent =
      "発行失敗：" + e.message;

  } finally {

    granting = false;

    el("grantButton").disabled = false;

  }

};

<script type="module">

import {
  getFirestore,
  collection,
  doc,
  onSnapshot,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

const db = getFirestore();
const auth = getAuth();

const ADMIN =
  "w3ZZn1g16fT9wfep9rkMzt7VrPt2";

const el = id =>
  document.getElementById(id);

const fmt = n =>
  Number(n || 0).toLocaleString("ja-JP");

const colors = [
  "#ffffff",
  "#222222",
  "#df4040",
  "#3478d8",
  "#f5d84c",
  "#37a76b"
];

let race = {};
let tickets = [];
let names = new Map();
let stops = [];
let raceNames = new Map();

function node(tag, text, cls) {
  const d = document.createElement(tag);

  if(text !== undefined) {
    d.textContent = text;
  }

  if(cls) d.className = cls;

  return d;
}

function playerName(uid) {
  return names.get(uid)
    || "参加者 " + String(uid).slice(0,6);
}

function raceName(round) {

  if(round === race.round) {
    return [
      race.venue,
      race.raceNo ? race.raceNo+"R" : "",
      race.name
    ].filter(Boolean).join(" ")
    || "現在のレース";
  }

  return raceNames.get(round)
    || "過去のレース "
      + String(round || "").slice(0,8);
}

function renderOdds() {

  const area = el("oddsView");

  if(!area) return;

  const odds = race.finalOdds || race.odds || {};

  if(!Object.keys(odds).length) return;

  area.replaceChildren();

  const admin =
    auth.currentUser?.uid === ADMIN;

  const totals = {};

  let total = 0;

  if(admin) {

    tickets.filter(t =>
      t.round === race.round
    ).forEach(t => {

      totals[t.key] =
        (totals[t.key] || 0) + t.stake;

      total += t.stake;

    });

  }

  const heading = node(
    "p",
    race.finalOdds
      ? "確定オッズ"
      : admin && race.status === "受付中"
        ? "変動オッズ・管理者表示"
        : "基本オッズ",
    "ggw-muted"
  );

  area.append(heading);

  const grid = node(
    "div",
    undefined,
    "ggw-odds-grid"
  );

  for(let n=1; n<=6; n++) {

    const card = node(
      "div",
      undefined,
      "ggw-odds-card"
    );

    const head = node(
      "div",
      n+"号艇 1着",
      "ggw-odds-head"
    );

    head.style.background = colors[n-1];

    head.style.color =
      [1,5].includes(n)
        ? "#111111"
        : "#ffffff";

    card.append(head);

    Object.entries(odds)
      .filter(([key]) =>
        key.startsWith(n+"-")
      )
      .sort(([a],[b]) =>
        a.localeCompare(b)
      )
      .forEach(([key,base]) => {

        let value = Number(base);

        if(
          admin &&
          race.dynamicOdds &&
          !race.finalOdds &&
          race.status === "受付中"
        ) {

          value = Math.max(
            5,
            Math.floor(
              10 * (
                base * 10000 + total * 0.75
              ) / (
                10000 + base * (totals[key] || 0)
              )
            ) / 10
          );

        }

        const row = node(
          "div",
          undefined,
          "ggw-odds-row"
        );

        row.append(
          node("span",key),
          node("strong",value.toFixed(1)+"倍")
        );

        card.append(row);

      });

    grid.append(card);

  }

  area.append(grid);

}

function stat(label,value,cls) {

  const box = node(
    "div",
    undefined,
    "ggw-stat"
  );

  box.append(
    node("small",label,"ggw-muted"),
    node("strong",value,cls)
  );

  return box;

}

function summary(list) {

  const purchase = list.reduce(
    (s,t)=>s+Number(t.stake || 0),0
  );

  const payout = list.reduce(
    (s,t)=>s+(t.settled
      ? Number(t.payout || 0):0),0
  );

  const settledStake = list.reduce(
    (s,t)=>s+(t.settled
      ? Number(t.stake || 0):0),0
  );

  const profit = payout-settledStake;

  const grid = node(
    "div",
    undefined,
    "ggw-summary"
  );

  grid.append(

    stat("購入ポイント",fmt(purchase)+" pt"),

    stat("払戻ポイント",fmt(payout)+" pt"),

    stat(
      "確定収支",
      (profit>0?"+":"")+fmt(profit)+" pt",
      profit<0?"ggw-loss":"ggw-profit"
    ),

    stat(
      "未確定投票",
      fmt(purchase-settledStake)+" pt"
    )

  );

  return grid;

}

function ticketCard(t,showName) {

  const card = node(
    "div",
    undefined,
    "ggw-ticket-card"
  );

  if(showName) {

    card.append(
      node("strong",playerName(t.uid))
    );

  }

  card.append(

    node("div",t.key,"ggw-ticket-key"),

    node("p","購入："+fmt(t.stake)+" pt"),

    node(
      "p",
      "オッズ："+Number(
        t.finalOdds ?? t.odds ?? 0
      ).toFixed(1)+"倍"
    )

  );

  if(t.settled) {

    const profit =
      Number(t.payout || 0)-Number(t.stake);

    card.append(

      node(
        "p",
        "払戻："+fmt(t.payout)+" pt"
      ),

      node(
        "p",
        "収支："+
        (profit>0?"+":"")+
        fmt(profit)+" pt",
        profit<0?"ggw-loss":"ggw-profit"
      )

    );

  } else {

    card.append(
      node("p","結果待ち","ggw-muted")
    );

  }

  return card;

}

function renderHistory(area,list,admin) {

  if(!area) return;

  area.replaceChildren();

  if(!list.length) {

    area.textContent = "投票履歴はありません";

    return;

  }

  const groups = new Map();

  list.forEach(t=>{

    const key = t.round || "unknown";

    if(!groups.has(key)) {
      groups.set(key,[]);
    }

    groups.get(key).push(t);

  });

  const ordered = [...groups.entries()];

  ordered.sort((a,b)=>
    Number(b[0]===race.round)-
    Number(a[0]===race.round)
  );

  for(const [round,records] of ordered) {

    const box = node(
      "div",
      undefined,
      "ggw-race-card"
    );

    box.append(

      node("h3",raceName(round)),

      node(
        "p",
        records.length+"件の投票",
        "ggw-muted"
      ),

      summary(records)

    );

    if(admin) {

      const players = new Map();

      records.forEach(t=>{

        if(!players.has(t.uid)) {
          players.set(t.uid,[]);
        }

        players.get(t.uid).push(t);

      });

      const details = node("details");

      details.append(
        node("summary","参加者別の収支")
      );

      for(const [uid,items] of players) {

        const card = node(
          "div",
          undefined,
          "ggw-ticket-card"
        );

        card.append(
          node("strong",playerName(uid)),
          summary(items)
        );

        details.append(card);

      }

      box.append(details);

    }

    const detail = node("details");

    detail.open = round === race.round;

    detail.append(
      node("summary","投票明細を見る")
    );

    records.forEach(t=>{

      detail.append(ticketCard(t,admin));

    });

    box.append(detail);

    area.append(box);

  }

}

function renderAll() {

  const user = auth.currentUser;

  renderOdds();

  if(!user) return;

  renderHistory(
    el("history"),
    tickets.filter(t=>t.uid===user.uid),
    false
  );

  if(user.uid===ADMIN) {

    renderHistory(
      el("auditView"),
      tickets,
      true
    );

  }

}

onSnapshot(

  doc(db,"races","current"),

  snap=>{

    race = snap.data() || {};

    if(race.round) {

      raceNames.set(
        race.round,
        raceName(race.round)
      );

    }

    setTimeout(renderAll,50);

  }

);

onAuthStateChanged(auth,user=>{

  stops.forEach(stop=>stop());

  stops = [];

  tickets = [];

  names.clear();

  if(el("auditView")) {
    el("auditView").replaceChildren();
  }

  if(!user) return;

  const admin = user.uid===ADMIN;

  const ticketQuery = admin

    ? collection(db,"tickets")

    : query(
        collection(db,"tickets"),
        where("uid","==",user.uid)
      );

  stops.push(

    onSnapshot(

      ticketQuery,

      snap=>{

        tickets = snap.docs.map(d=>d.data());

        setTimeout(renderAll,50);

      },

      error=>{

        const area = admin
          ? el("auditView")
          : el("history");

        if(area) {

          area.textContent =
            "取得エラー："+error.message;

        }

      }

    )

  );

  stops.push(

    onSnapshot(

      collection(db,"profiles"),

      snap=>{

        names = new Map(
          snap.docs.map(d=>[
            d.id,
            d.data().nickname
          ])
        );

        setTimeout(renderAll,50);

      }

    )

  );

});

if(el("auditRefresh")) {

  el("auditRefresh").onclick = async()=>{

    if(auth.currentUser?.uid!==ADMIN) return;

    try {

      const snap = await getDocs(
        collection(db,"tickets")
      );

      tickets = snap.docs.map(d=>d.data());

      renderAll();

    } catch(e) {

      el("auditView").textContent = e.message;

    }

  };

}

<script type="module">

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  onSnapshot,
  runTransaction,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

const auth = getAuth();
const db = getFirestore();

const ADMIN =
"w3ZZn1g16fT9wfep9rkMzt7VrPt2";

const el = id => document.getElementById(id);

let players = [];
let records = [];
let stops = [];

const style = document.createElement("style");

style.textContent = `
.ggw-profile-card {
  background:linear-gradient(145deg,#202b3c,#101722);
  border:1px solid #a88a43;
  border-radius:15px;
  padding:15px;
  margin:12px 0;
  overflow-wrap:anywhere;
}
.ggw-profile-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.ggw-profile-stat {
  background:#0d1420;
  border:1px solid #354052;
  border-radius:10px;
  padding:12px;
}
.ggw-profile-stat strong {
  display:block;
  color:#f5cf65;
  font-size:23px;
  margin-top:6px;
}
.ggw-profile-title {
  color:#f5cf65;
  font-size:22px;
  font-weight:900;
}
.ggw-profile-rank {
  border:1px solid #354052;
  border-radius:10px;
  padding:12px;
  margin:6px 0;
  background:#171e2c;
  color:white;
}
`;

document.head.append(style);

const panel = document.createElement("div");

panel.className = "ggw-profile-card";

panel.innerHTML = `
<h2>👤 選手プロフィール</h2>
<select id="ggwPlayerSelect"></select>
<button id="ggwShowProfile">プロフィールを見る</button>
<div id="ggwProfileView"></div>
<h3>🏆 賞金ランキング</h3>
<div id="ggwPrizeRanking"></div>
`;

el("userArea").append(panel);

const adminPanel = document.createElement("div");

adminPanel.className = "ggw-profile-card";

adminPanel.innerHTML = `
<h2>🏆 選手成績登録</h2>

<label>レース名
<input id="ggwRaceName"
placeholder="ギャンギャン杯">
</label>

<label>レースグレード
<select id="ggwGrade">
<option>SG</option>
<option>G1</option>
<option>G2</option>
<option>G3</option>
<option>一般戦</option>
</select>
</label>

<label>レース識別番号
<input id="ggwRaceID"
placeholder="例：20261127-12R">
</label>

<label>
<input type="checkbox"
id="ggwFinal"
style="width:auto">
優勝戦
</label>

<div id="ggwFinishers"></div>

<button id="ggwSaveResult">
選手成績を確定
</button>

<p id="ggwResultMessage"></p>
`;

el("adminArea").append(adminPanel);

for(let n=1;n<=6;n++){

  const row = document.createElement("div");

  row.className = "ggw-profile-card";

  row.innerHTML = `
  <h3>${n}着</h3>
  <select id="ggwRacer${n}"></select>
  <label>獲得賞金ポイント（記録用）
  <input id="ggwPrize${n}"
  type="number"
  min="0"
  step="100"
  value="0">
  </label>
  `;

  el("ggwFinishers").append(row);
}

function number(n){
  return n.toLocaleString("ja-JP");
}

function fillPlayers(){

  const ids = [
    "ggwPlayerSelect",
    ...Array.from(
      {length:6},
      (_,i)=>"ggwRacer"+(i+1)
    )
  ];

  ids.forEach(id=>{

    const select = el(id);
    const old = select.value;

    select.replaceChildren();

    const empty = document.createElement("option");

    empty.value = "";
    empty.textContent = "選手を選択";

    select.append(empty);

    players.forEach(p=>{

      const option =
      document.createElement("option");

      option.value = p.uid;
      option.textContent = p.name;

      select.append(option);

    });

    if(players.some(p=>p.uid===old)){
      select.value=old;
    }

  });

}

function stats(uid){

  const result = {
    starts:0,
    first:0,
    second:0,
    third:0,
    wins:0,
    sg:0,
    prize:0,
    recent:[]
  };

  records.forEach(r=>{

    const index = r.finishers.findIndex(
      p=>p.uid===uid
    );

    if(index===-1)return;

    result.starts++;

    if(index===0)result.first++;
    if(index===1)result.second++;
    if(index===2)result.third++;

    if(index===0 && r.isFinal){

      result.wins++;

      if(r.grade==="SG"){
        result.sg++;
      }

    }

    result.prize +=
      r.finishers[index].prize;

    result.recent.push(index+1);

  });

  return result;

}

function rate(n,total){

  return total
    ? (n/total*100).toFixed(1)+"%"
    : "0.0%";

}

function title(s){

  if(s.wins>=10)
    return "👑 絶対王者";

  if(s.sg>=1)
    return "🏆 SG覇者";

  if(s.wins>=5)
    return "💎 ギャンギャンの猛者";

  if(s.wins>=1)
    return "⚡ 期待の新星";

  if(s.starts>=30)
    return "🔥 ベテランレーサー";

  return "🔰 新人レーサー";

}

function showProfile(uid){

  const p = players.find(
    x=>x.uid===uid
  );

  const area = el("ggwProfileView");

  area.replaceChildren();

  if(!p){

    area.textContent =
      "選手を選択してください";

    return;

  }

  const s = stats(uid);

  const card = document.createElement("div");

  card.className = "ggw-profile-card";

  const name = document.createElement("div");

  name.className = "ggw-profile-title";
  name.textContent = p.name;

  const rank = document.createElement("p");

  rank.textContent = title(s);
  rank.style.color = "#f5cf65";

  card.append(name,rank);

  const grid = document.createElement("div");

  grid.className = "ggw-profile-grid";

  const values = [

    ["通算出走",s.starts+"回"],

    ["1着回数",s.first+"回"],

    ["1着率",rate(s.first,s.starts)],

    ["2連対率",
      rate(s.first+s.second,s.starts)],

    ["3連対率",
      rate(s.first+s.second+s.third,s.starts)],

    ["優勝回数",s.wins+"回"],

    ["SG優勝",s.sg+"回"],

    ["獲得賞金",number(s.prize)+"pt"]

  ];

  values.forEach(([label,value])=>{

    const box = document.createElement("div");

    box.className = "ggw-profile-stat";

    box.textContent = label;

    const strong =
      document.createElement("strong");

    strong.textContent = value;

    box.append(strong);
    grid.append(box);

  });

  card.append(grid);

  const recent = document.createElement("p");

  recent.textContent =
    "最近10走："+
    (
      s.recent.slice(0,10)
      .map(n=>n+"着")
      .join(" / ")
      || "記録なし"
    );

  card.append(recent);

  area.append(card);

}

function ranking(){

  const area = el("ggwPrizeRanking");

  area.replaceChildren();

  const list = players.map(p=>({

    ...p,
    ...stats(p.uid)

  })).sort((a,b)=>b.prize-a.prize);

  list.forEach((p,i)=>{

    const button =
      document.createElement("button");

    button.className = "ggw-profile-rank";

    const medal =
      ["🥇","🥈","🥉"][i] || (i+1)+"位";

    button.textContent =
      medal+" "+p.name+
      " / "+number(p.prize)+"pt";

    button.onclick = ()=>{

      el("ggwPlayerSelect").value = p.uid;

      showProfile(p.uid);

      el("ggwProfileView").scrollIntoView({
        behavior:"smooth",
        block:"center"
      });

    };

    area.append(button);

  });

}

el("ggwShowProfile").onclick = ()=>{

  showProfile(
    el("ggwPlayerSelect").value
  );

};

el("ggwPlayerSelect").onchange = ()=>{

  showProfile(
    el("ggwPlayerSelect").value
  );

};

el("ggwSaveResult").onclick = async()=>{

  if(auth.currentUser?.uid!==ADMIN)return;

  const message = el("ggwResultMessage");

  const button = el("ggwSaveResult");

  const name =
    el("ggwRaceName").value.trim();

  const grade =
    el("ggwGrade").value;

  const raceID =
    el("ggwRaceID").value.trim();

  const isFinal =
    el("ggwFinal").checked;

  if(!name || !/^[A-Za-z0-9_-]{1,80}$/.test(raceID)){

    message.textContent =
      "レース名と正しい識別番号を入力してください";

    return;

  }

  const finishers = [];

  for(let n=1;n<=6;n++){

    const uid =
      el("ggwRacer"+n).value;

    const prize =
      Number(el("ggwPrize"+n).value);

    if(!uid ||
       !Number.isSafeInteger(prize) ||
       prize<0){

      message.textContent =
        "全選手と賞金を確認してください";

      return;

    }

    finishers.push({
      uid,
      place:n,
      prize
    });

  }

  if(new Set(
    finishers.map(p=>p.uid)
  ).size!==6){

    message.textContent =
      "同じ選手が重複しています";

    return;

  }

  if(!confirm("選手成績を確定しますか？")){
    return;
  }

  button.disabled = true;

  try{

    const ref =
      doc(db,"racerResults",raceID);

    await runTransaction(db,async t=>{

  const old = await t.get(ref);

  if(old.exists()){
    throw Error(
      "このレースは既に登録済みです"
    );
  }

  const accounts = [];

  for(const player of finishers){

    const userRef = doc(
      db,"users",player.uid
    );

    const snapshot = await t.get(userRef);

    if(!snapshot.exists()){
      throw Error("選手のアカウントがありません");
    }

    const points = snapshot.data().points;

    if(!Number.isSafeInteger(points)){
      throw Error("所持ポイントが不正です");
    }

    const total = points + player.prize;

    if(!Number.isSafeInteger(total)){
      throw Error("ポイント上限エラー");
    }

    accounts.push({
      ref:userRef,
      points:total
    });

  }

  for(const account of accounts){

    t.update(account.ref,{
      points:account.points
    });

  }

  t.set(ref,{
    name,
    grade,
    isFinal,
    finishers,
    prizePaid:true,
    createdAt:serverTimestamp()
  });

});

    message.textContent =
      "🏆 選手成績の登録完了！";

  }catch(e){

    message.textContent =
      "登録失敗："+e.message;

  }finally{

    button.disabled = false;

  }

};

onAuthStateChanged(auth,user=>{

  stops.forEach(stop=>stop());
  stops=[];

  players=[];
  records=[];

  fillPlayers();

  el("ggwProfileView").replaceChildren();
  el("ggwPrizeRanking").replaceChildren();

  if(!user)return;

  stops.push(

    onSnapshot(

      collection(db,"profiles"),

      snap=>{

        players = snap.docs.map(d=>({

          uid:d.id,
          name:d.data().nickname

        }));

        fillPlayers();

        if(!el("ggwPlayerSelect").value){

          el("ggwPlayerSelect").value =
            user.uid;

        }

        showProfile(
          el("ggwPlayerSelect").value
        );

        ranking();

      },

      e=>{
        el("ggwProfileView").textContent =
          e.message;
      }

    )

  );

  stops.push(

    onSnapshot(

      collection(db,"racerResults"),

      snap=>{

        records = snap.docs.map(
          d=>d.data()
        ).sort((a,b)=>

          (b.createdAt?.seconds||0)-
          (a.createdAt?.seconds||0)

        );

        showProfile(
          el("ggwPlayerSelect").value
        );

        ranking();

      },

      e=>{
        el("ggwProfileView").textContent =
          e.message;
      }

    )

  );

});

<script>

(() => {

  const el = id =>
    document.getElementById(id);

  function collapsePanel(panel,title) {

    if(!panel) return;

    if(panel.dataset.v5Wrapped) return;

    panel.dataset.v5Wrapped = "true";

    const detail =
      document.createElement("details");

    const summary =
      document.createElement("summary");

    summary.textContent = title;

    panel.before(detail);

    detail.append(summary,panel);

  }

  function collapseContent(id,title) {

    const content = el(id);

    if(!content) return;

    if(content.dataset.v5Wrapped) return;

    content.dataset.v5Wrapped = "true";

    const previous =
      content.previousElementSibling;

    if(previous &&
       previous.tagName === "H3") {

      previous.hidden = true;

    }

    const detail =
      document.createElement("details");

    const summary =
      document.createElement("summary");

    summary.textContent = title;

    content.before(detail);

    detail.append(summary,content);

  }

  function groupRange(start,end,title,opened) {

    if(!start || !end) return;

    if(start.parentNode !== end.parentNode) {
      return;
    }

    if(start.dataset.v5Grouped) return;

    const items = [];

    let current = start;

    while(current) {

      items.push(current);

      if(current === end) break;

      current = current.nextElementSibling;

    }

    if(items[items.length-1] !== end) {
      return;
    }

    start.dataset.v5Grouped = "true";

    const detail =
      document.createElement("details");

    detail.open = opened;

    const summary =
      document.createElement("summary");

    summary.textContent = title;

    const panel =
      document.createElement("div");

    panel.className = "ggw-v5-panel";

    start.before(detail);

    detail.append(summary,panel);

    items.forEach(item => panel.append(item));

  }

  function setup() {

    collapsePanel(
      el("transferPanel"),
      "💸 ポイント譲渡・名前設定"
    );

    const profile =
      el("ggwPlayerSelect")
      ?.closest(".ggw-profile-card");

    collapsePanel(
      profile,
      "👤 選手プロフィール・賞金ランキング"
    );

    collapseContent(
      "history",
      "🎫 レース別投票履歴"
    );

    collapseContent(
      "ranking",
      "🏆 ポイントランキング"
    );

    const admin = el("adminArea");

    if(admin) {

      const headings =
        Array.from(admin.children)
        .filter(x=>x.tagName==="H3");

      const raceHeading =
        headings.find(x=>
          x.textContent.trim()==="レース管理"
        );

      const resultHeading =
        headings.find(x=>
          x.textContent.trim()==="レース結果"
        );

      groupRange(
        raceHeading,
        el("retryOdds") || el("close"),
        "🚤 レース設定・受付管理",
        true
      );

      groupRange(
        resultHeading,
        el("reset"),
        "🏁 結果登録・払戻処理",
        false
      );

    }

    const resultPanel =
      el("ggwSaveResult")
      ?.closest(".ggw-profile-card");

    collapsePanel(
      resultPanel,
      "🏆 選手成績・賞金登録"
    );

    const status = el("status");

    if(status) {

      const value =
        status.textContent.trim();

      if(status.dataset.state !== value) {

        status.dataset.state = value;

      }

    }

  }

  window.addEventListener("load",setup);

  let scheduled = false;

  const observer =
    new MutationObserver(() => {

      if(scheduled) return;

      scheduled = true;

      requestAnimationFrame(() => {

        scheduled = false;

        setup();

      });

    });

  observer.observe(document.body,{
    childList:true,
    subtree:true,
    characterData:true
  });

  setup();

})();

<script>
(() => {

  if(document.getElementById("ggwOddsSort")) return;

  const area =
    document.getElementById("oddsView");

  if(!area) return;

  let mode = "normal";

  const colors = [
    "#ffffff",
    "#242424",
    "#e53935",
    "#2979ff",
    "#ffdf45",
    "#229954"
  ];

  const menu = document.createElement("div");

  menu.id = "ggwOddsSort";

  const sorted = document.createElement("div");

  sorted.id = "ggwSortedOdds";
  sorted.hidden = true;

  area.before(menu);
  area.after(sorted);

  const modes = [
    ["normal","通常"],
    ["low","⬇ 低い順"],
    ["high","⬆ 高い順"]
  ];

  modes.forEach(([value,label]) => {

    const btn = document.createElement("button");

    btn.type = "button";
    btn.textContent = label;
    btn.dataset.mode = value;

    btn.onclick = () => {

      mode = value;
      render();

    };

    menu.append(btn);

  });

  function render() {

    menu.querySelectorAll("button")
      .forEach(btn => {

        btn.classList.toggle(
          "active",
          btn.dataset.mode === mode
        );

      });

    area.hidden = mode !== "normal";
    sorted.hidden = mode === "normal";

    if(mode === "normal") return;

    const records = [];

    const rows = area.querySelectorAll(
      ".ggw-odds-row"
    );

    rows.forEach(row => {

      const key =
        row.querySelector("span")
          ?.textContent.trim();

      const value = Number(
        row.querySelector("strong")
          ?.textContent.replace("倍","")
          .replaceAll(",","")
      );

      if(
        key &&
        Number.isFinite(value) &&
        value >= 1
      ) {

        records.push({key,value});

      }

    });

    records.sort((a,b) => {

      const diff = mode === "low"
        ? a.value - b.value
        : b.value - a.value;

      return diff || a.key.localeCompare(b.key);

    });

    sorted.replaceChildren();

    const heading =
      document.createElement("div");

    heading.className = "ggw-sort-heading";

    heading.textContent =
      mode === "low"
        ? "人気順ランキング"
        : "高配当ランキング";

    sorted.append(heading);

    if(!records.length) {

      const msg = document.createElement("p");

      msg.textContent =
        "オッズ情報がありません";

      sorted.append(msg);

      return;

    }

    records.forEach((record,i) => {

      const row =
        document.createElement("div");

      row.className = "ggw-sort-row";

      const rank =
        document.createElement("span");

      rank.className = "ggw-sort-rank";

      rank.textContent = (i+1)+"位";

      const boats =
        document.createElement("div");

      boats.className = "ggw-sort-boats";

      record.key.split("-").forEach(n => {

        const boat =
          document.createElement("span");

        boat.className = "ggw-sort-boat";

        boat.textContent = n;

        boat.style.background =
          colors[Number(n)-1];

        boat.style.color =
          ["1","5"].includes(n)
            ? "#111111"
            : "#ffffff";

        boats.append(boat);

      });

      const odds =
        document.createElement("strong");

      odds.className = "ggw-sort-value";

      odds.textContent =
        record.value.toLocaleString("ja-JP",{
          minimumFractionDigits:1,
          maximumFractionDigits:1
        })+"倍";

      row.append(rank,boats,odds);

      sorted.append(row);

    });

  }

  let scheduled = false;

  const observer =
    new MutationObserver(() => {

      if(scheduled) return;

      scheduled = true;

      requestAnimationFrame(() => {

        scheduled = false;

        render();

      });

    });

  observer.observe(area,{
    childList:true,
    subtree:true,
    characterData:true
  });

  render();

})();

<script>
(() => {

  if(window.ggwRankingV6) return;

  window.ggwRankingV6 = true;

  function makePart(cls,text) {

    const node =
      document.createElement("span");

    node.className = cls;
    node.textContent = text;

    return node;

  }

  function decorate(area,isPrize) {

    if(!area) return;

    const cards = Array.from(area.children)
      .filter(node => isPrize
        ? node.matches("button.ggw-profile-rank")
        : node.tagName === "DIV" &&
          (
            node.classList.contains("ggw-rank-v6") ||
            node.children.length === 2
          )
      );

    if(!cards.length) return;

    cards.forEach((card,i) => {

      if(card.dataset.rankV6 === "done") {
        return;
      }

      let name;
      let points;

      if(isPrize) {

        const text = card.textContent.trim();

        const match = text.match(
          /^(.*?)\s*\/\s*([\d,.-]+)\s*pt\s*$/
        );

        if(!match) return;

        name = match[1].replace(
          /^(?:🥇|🥈|🥉|\d+位)\s*/,
          ""
        );

        points = match[2];

      } else {

        const first = card.children[0];
        const second = card.children[1];

        if(!first || !second) return;

        name = first.textContent.replace(
          /^(?:👑|🥈|🥉)?\s*第\d+位\s*/,
          ""
        ).trim();

        points = second.textContent
          .replace(/\s*pt\s*$/,"")
          .trim();

        if(!/^-?[\d,.]+$/.test(points)) {
          return;
        }

      }

      const rank = i+1;

      card.dataset.rankV6 = "done";
      card.dataset.rank = String(rank);

      card.classList.add("ggw-rank-v6");

      const medal = [
        "👑 1位",
        "🥈 2位",
        "🥉 3位"
      ][i] || rank+"位";

      const rankNode = makePart(
        "ggw-rank-v6-number",
        medal
      );

      const nameNode = makePart(
        "ggw-rank-v6-name",
        name
      );

      const pointNode = makePart(
        "ggw-rank-v6-points",
        points
      );

      const unit =
        document.createElement("small");

      unit.textContent = "pt";

      pointNode.append(unit);

      card.replaceChildren(
        rankNode,
        nameNode,
        pointNode
      );

    });

    if(
      cards.length > 3 &&
      !area.querySelector(".ggw-rank-v6-header")
    ) {

      const header =
        document.createElement("div");

      header.className = "ggw-rank-v6-header";

      const left =
        document.createElement("span");

      left.textContent = "順位 / 選手名";

      const right =
        document.createElement("span");

      right.textContent = isPrize
        ? "獲得賞金"
        : "所持ポイント";

      header.append(left,right);

      cards[3].before(header);

    }

  }

  function setup() {

    decorate(
      document.getElementById("rankingList"),
      false
    );

    decorate(
      document.getElementById("ggwPrizeRanking"),
      true
    );

  }

  let scheduled = false;

  const observer =
    new MutationObserver(() => {

      if(scheduled) return;

      scheduled = true;

      requestAnimationFrame(() => {

        scheduled = false;

        setup();

      });

    });

  observer.observe(document.body,{
    childList:true,
    subtree:true
  });

  window.addEventListener("load",setup);

  setup();

})();
</script>
